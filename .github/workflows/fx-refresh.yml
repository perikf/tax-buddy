name: FX refresh

on:
  schedule:
    - cron: "30 16 * * 1-5"   # weekdays, after the ECB ~16:00 CET publication
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python backend/scripts/fx_rates.py
      - name: Commit updated rates
        run: |
          if git diff --quiet backend/data/fx_rates.csv; then
            echo "Rates already current."
            exit 0
          fi
          git config user.name "fx-refresh[bot]"
          git config user.email "actions@github.com"
          git add backend/data/fx_rates.csv
          git commit -m "chore(fx): daily ECB rates refresh"
          git push
