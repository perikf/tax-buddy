<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tax Buddy — IBKR to UK Capital Gains</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>" />
    <script>
      // Self-heal a stale cached page: if a hashed asset 404s (its build was
      // replaced by a deploy), reload once bypassing the HTTP cache.
      window.addEventListener(
        "error",
        function (e) {
          var el = e.target || {};
          var url = el.src || el.href || "";
          if (/\/assets\/.*\.(js|css)$/.test(url) && !sessionStorage.getItem("tb-healed")) {
            sessionStorage.setItem("tb-healed", "1");
            location.reload();
          }
        },
        true
      );
      window.addEventListener("load", function () {
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) sessionStorage.removeItem("tb-healed");
        }, 1500);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
